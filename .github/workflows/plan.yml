name: terraform-plan

#checkov:skip=CKV_GHA_7:owner=repository-maintainer; exact=workflow_dispatch inputs; rationale=manual booleans select only the contents of a non-applying saved plan; control=the run is pinned to its Git commit and produces a manifest/hash, while apply independently verifies the current main commit, run identity, artifact, and environment approval.
on:
  # Unfiltered on purpose: the `static` job below is a required status check
  # on main, and a required check that is filtered out of a PR never reports,
  # so GitHub holds that PR at "Expected" indefinitely. The checks are
  # credential-free and take about a minute.
  pull_request:
  workflow_dispatch:
    inputs:
      stack:
        description: Which stack to plan (the booleans below apply to lab only)
        required: true
        type: choice
        default: lab
        # Deliberately no "both": apply.yml requires the source run's
        # conclusion to be `success`, so a run containing both stacks would let
        # a transient Cloudflare API failure invalidate an already-reviewed lab
        # plan and force the whole review cycle to repeat. Two dispatches, two
        # run conclusions, two independent approvals.
        options: [lab, cloudflare]
      enable_test_vm_app:
        description: Preserve/create the app test VM in this plan
        required: true
        type: boolean
        default: false
      enable_test_vm_mgmt:
        description: Preserve/create the management test VM in this plan
        required: true
        type: boolean
        default: false
      enable_test_nic_app:
        description: Preserve/create the app test NIC in this plan
        required: true
        type: boolean
        default: false
      enable_test_nic_mgmt:
        description: Preserve/create the management test NIC in this plan
        required: true
        type: boolean
        default: false
      enable_private_resolver:
        description: Enable the cost-bearing DNS Private Resolver in this plan
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  static:
    name: Credential-free Terraform checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.9.0"

      - name: Terraform format
        run: terraform fmt -check -recursive terraform

      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0

      - name: TFLint
        env:
          # `tflint --recursive` re-executes the linter inside each directory
          # and every one of those child runs looks for its own .tflint.hcl —
          # a config file sitting at terraform/ never reaches terraform/envs/lab
          # or terraform/modules/*. Measured locally: with the config present
          # but this variable unset, `--only` on any azurerm rule fails with
          # "Rule not found" in every subdirectory, i.e. the provider ruleset
          # silently does not run. TFLINT_CONFIG_FILE is read by each child
          # run, so it is what actually makes one shared config apply.
          TFLINT_CONFIG_FILE: ${{ github.workspace }}/terraform/.tflint.hcl
          # `--init` fetches the azurerm ruleset through the GitHub releases
          # API. Unauthenticated installs share the 60-requests-per-hour
          # anonymous limit per source IP across hosted runners, and this job
          # is a required check on every PR — a rate-limit hit would block all
          # of them. The token makes the install authenticated.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tflint --init && tflint --recursive
        working-directory: terraform

      # WR-04: bridgecrewio/checkov-action@v12 (v12.3117.0) resolves to
      # `docker://ghcr.io/bridgecrewio/checkov:3.3.11` — a mutable image tag,
      # so even a SHA-pinned action re-resolves its container on every run.
      # Run the same image by immutable digest instead. The image entrypoint
      # reads only INPUT_* variables (github_action_resources/entrypoint.sh in
      # bridgecrewio/checkov), so the env block below reproduces exactly what
      # the action wrapper passed, action-input defaults included.
      - name: Checkov
        uses: docker://ghcr.io/bridgecrewio/checkov@sha256:e5e308e713725e73f517e4cb85b39d467f1e047204c174fb15eb444c27ffb745 # checkov 3.3.11
        env:
          INPUT_DIRECTORY: terraform
          INPUT_QUIET: "true"
          INPUT_SOFT_FAIL: "false"
          INPUT_OUTPUT_FORMAT: sarif
          INPUT_LOG_LEVEL: WARNING

      - name: Terraform validate without a backend or Azure credentials
        shell: bash
        run: |
          set -euo pipefail
          for directory in terraform/bootstrap terraform/envs/lab terraform/cloudflare; do
            terraform -chdir="$directory" init -backend=false -input=false
            terraform -chdir="$directory" validate -no-color
          done

  # Exactly one saved-plan job runs per dispatch, selected by `stack`. The two
  # stacks never share a run conclusion, because apply.yml keys on it.
  plan:
    name: Saved plan from current main
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
      && inputs.stack == 'lab'
    needs: static
    runs-on: ubuntu-latest
    # CR-08 (2026-08-13 review): saved-plan jobs join the shared mutation
    # group — a plan created while an apply is in flight passes its freshness
    # check against a main the apply has not yet reconciled with reality.
    # cancel-in-progress stays false so a queued run can never kill a
    # half-finished apply. The `static` PR check deliberately stays out.
    concurrency:
      group: terraform-mutations
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
    defaults:
      run:
        shell: bash
        working-directory: terraform/envs/lab

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.9.0"

      - name: Azure login (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve remote-state account
        id: backend
        run: |
          set -euo pipefail
          storage_account_name="$(az storage account list \
            --resource-group rg-cham-tfstate \
            --query '[0].name' \
            --output tsv)"
          if [[ -z "$storage_account_name" || "$storage_account_name" == "None" ]]; then
            echo "::error::No Terraform state storage account was found in rg-cham-tfstate."
            exit 1
          fi
          echo "::add-mask::$storage_account_name"
          echo "name=$storage_account_name" >> "$GITHUB_OUTPUT"

      - name: Create saved plan and sanitized manifest
        id: plan
        env:
          TF_VAR_home_ip: ${{ secrets.HOME_IP }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_wg_peer_public_key: ${{ secrets.WG_PEER_PUBLIC_KEY }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_budget_start_date: ${{ vars.BUDGET_START_DATE }}
          TF_VAR_enable_test_vm_app: ${{ inputs.enable_test_vm_app }}
          TF_VAR_enable_test_vm_mgmt: ${{ inputs.enable_test_vm_mgmt }}
          TF_VAR_enable_test_nic_app: ${{ inputs.enable_test_nic_app }}
          TF_VAR_enable_test_nic_mgmt: ${{ inputs.enable_test_nic_mgmt }}
          TF_VAR_enable_private_resolver: ${{ inputs.enable_private_resolver }}
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure \
            -backend-config="storage_account_name=${{ steps.backend.outputs.name }}" \
            -backend-config="subscription_id=${ARM_SUBSCRIPTION_ID}" \
            -backend-config="tenant_id=${ARM_TENANT_ID}"

          # PR #11 review (P1): the human-readable delta names state-derived
          # values (the home IP inside NSG rules, the hub public IP), and
          # public-repository workflow logs are downloadable — so the complete
          # output goes to a private review file beside the saved plan, never
          # to stdout. Reviewers download it from the tfplans container and
          # compare the full delta before approving the hash (see the
          # runbook's saved-plan review procedure). The run attempt is part
          # of the blob prefix so a re-run can never overwrite bytes an
          # operator already reviewed.
          blob_prefix="lab/apply/${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "blob_prefix=$blob_prefix" >> "$GITHUB_OUTPUT"
          plan_exit=0
          terraform plan -input=false -no-color -out=tfplan > plan-output.txt 2>&1 || plan_exit=$?
          if [[ "$plan_exit" -ne 0 ]]; then
            stored=true
            # Container creation failing does not mean the upload will: the
            # container usually already exists, and a transient 409 or throttle
            # here is routine. Only the upload decides whether the output
            # survived — clearing the flag on this call told operators their
            # diagnostics were gone while the blob sat in the container.
            az storage container create --name tfplans \
              --account-name "${{ steps.backend.outputs.name }}" \
              --auth-mode login --output none || true
            az storage blob upload \
              --account-name "${{ steps.backend.outputs.name }}" \
              --container-name tfplans \
              --name "${blob_prefix}/plan-output.txt" \
              --file plan-output.txt --auth-mode login --overwrite false --output none \
              || stored=false
            # Both az calls above are allowed to fail, so the message must not
            # state as fact that the output is retrievable. Terraform's stdout
            # and stderr went to that file and were never echoed, so if the
            # upload lost them, this log is all the operator has — say so
            # rather than sending them to a blob that is not there.
            if [[ "$stored" == "true" ]]; then
              echo "::error::terraform plan exited ${plan_exit}. The complete output is private at tfplans/${blob_prefix}/plan-output.txt (az storage blob download — see the runbook); it is not printed here because plan output on a public repository discloses state-derived values."
            else
              echo "::error::terraform plan exited ${plan_exit} AND its output could not be stored privately — nothing was written to tfplans/${blob_prefix}/, so no diagnostics survive this run. Reproduce locally with the same variables. The output is withheld from this log because it discloses state-derived values."
            fi
            exit "$plan_exit"
          fi

          plan_sha256="$(sha256sum tfplan | awk '{print $1}')"
          echo "sha256=$plan_sha256" >> "$GITHUB_OUTPUT"

          jq -n \
            --arg kind "apply" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit_sha "$GITHUB_SHA" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --arg plan_sha256 "$plan_sha256" \
            --arg plan_blob "${blob_prefix}/tfplan" \
            '{kind: $kind, repository: $repository, commit_sha: $commit_sha, workflow_run_id: $workflow_run_id, plan_sha256: $plan_sha256, plan_blob: $plan_blob}' \
            > plan-manifest.json

          terraform show -json tfplan \
            | jq -r '.resource_changes[] | select(.change.actions != ["no-op"]) | "\(.change.actions | join(",")) \(.address)"' \
            > changed-resources.txt

          {
            echo "Commit: $GITHUB_SHA"
            echo "SHA-256: $plan_sha256"
            echo "Changed resources:"
            if [[ -s changed-resources.txt ]]; then
              sed 's/^/- /' changed-resources.txt
            else
              echo "- none"
            fi
          } > plan-summary.txt
          cat plan-summary.txt >> "$GITHUB_STEP_SUMMARY"

      # NEW-CR-01 (2026-08-10 review): the raw plan binary embeds every input
      # variable value (including the HOME_IP secret), the full prior state
      # snapshot, and the backend configuration. On a public repository any
      # authenticated GitHub user can download workflow artifacts, so the plan
      # and its complete review output go to the private state account instead
      # — the same account both this job and the apply job already reach via
      # OIDC — and the artifact below carries only the sanitized manifest and
      # summary. The blob prefix encodes commit, run ID, and run attempt; the
      # manifest binds it, apply verifies it against the run identity, and
      # --overwrite false makes every reviewed plan attempt immutable.
      - name: Store saved plan and its review output in the private state account
        run: |
          set -euo pipefail
          az storage container create \
            --name tfplans \
            --account-name "${{ steps.backend.outputs.name }}" \
            --auth-mode login \
            --output none
          for file in tfplan plan-output.txt; do
            az storage blob upload \
              --account-name "${{ steps.backend.outputs.name }}" \
              --container-name tfplans \
              --name "${{ steps.plan.outputs.blob_prefix }}/${file}" \
              --file "$file" \
              --auth-mode login \
              --overwrite false \
              --output none
          done
          rm -f tfplan plan-output.txt

      - name: Upload sanitized plan-manifest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-plan-${{ github.sha }}
          path: |
            terraform/envs/lab/plan-manifest.json
            terraform/envs/lab/plan-summary.txt
          if-no-files-found: error
          # Matches the tfplans lifecycle policy. The runbook tells the
          # operator the review window is a week; an artifact expiring first
          # would spend a human approval and only then fail the download.
          retention-days: 7
          # A re-run writes a new attempt-scoped blob, but the artifact name is
          # keyed on the commit alone. Without this the manifest upload 409s on
          # the existing name and flips the run conclusion to failure,
          # permanently disqualifying an otherwise good plan from apply.
          # Overwriting is safe because the manifest is bound by hash: an
          # operator holding the earlier attempt's approved SHA-256 gets a
          # mismatch and is refused.
          overwrite: true

  # The public-DNS half of the split horizon (ADR-004 keeps it in its own
  # state). It gets the identical custody chain to the lab stack — dispatch
  # only, current main only, plan binary and complete delta to the private
  # tfplans container, sanitized manifest as the only public artifact —
  # because the material it plans against is a LIVE production zone carrying
  # Microsoft 365 mail records.
  plan-cloudflare:
    name: Saved Cloudflare plan from current main
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
      && inputs.stack == 'cloudflare'
    needs: static
    runs-on: ubuntu-latest
    # CR-08: same shared mutation group as every other state-touching job.
    concurrency:
      group: terraform-mutations
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
    defaults:
      run:
        shell: bash
        working-directory: terraform/cloudflare

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.9.0"

      # Azure, in a Cloudflare job, because the Terraform state for this stack
      # lives in the same private account as the lab stack's.
      - name: Azure login (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve remote-state account
        id: backend
        run: |
          set -euo pipefail
          storage_account_name="$(az storage account list \
            --resource-group rg-cham-tfstate \
            --query '[0].name' \
            --output tsv)"
          if [[ -z "$storage_account_name" || "$storage_account_name" == "None" ]]; then
            echo "::error::No Terraform state storage account was found in rg-cham-tfstate."
            exit 1
          fi
          echo "::add-mask::$storage_account_name"
          echo "name=$storage_account_name" >> "$GITHUB_OUTPUT"

      - name: Create saved Cloudflare plan and sanitized manifest
        id: plan
        env:
          # A plan issues GETs only, so the read-only token is sufficient here.
          # The edit token lives in the cloudflare-prod environment — its own,
          # not lab's, which also gates teardown — and is reachable only from
          # the human-approved apply job (DOC-B06).
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_RO }}
        run: |
          set -euo pipefail
          # This root's backend block is deliberately partial: main.tf pins the
          # resource group, container, and key, while the randomized storage
          # account, subscription, and tenant stay out of version control. A
          # bare `terraform init` therefore cannot initialize it.
          terraform init -input=false -reconfigure \
            -backend-config="storage_account_name=${{ steps.backend.outputs.name }}" \
            -backend-config="subscription_id=${ARM_SUBSCRIPTION_ID}" \
            -backend-config="tenant_id=${ARM_TENANT_ID}"

          blob_prefix="cloudflare/apply/${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "blob_prefix=$blob_prefix" >> "$GITHUB_OUTPUT"
          plan_exit=0
          terraform plan -input=false -no-color -out=cloudflare.tfplan \
            > cloudflare-plan-output.txt 2>&1 || plan_exit=$?
          if [[ "$plan_exit" -ne 0 ]]; then
            stored=true
            # Container creation failing does not mean the upload will: the
            # container usually already exists, and a transient 409 or throttle
            # here is routine. Only the upload decides whether the output
            # survived — clearing the flag on this call told operators their
            # diagnostics were gone while the blob sat in the container.
            az storage container create --name tfplans \
              --account-name "${{ steps.backend.outputs.name }}" \
              --auth-mode login --output none || true
            az storage blob upload \
              --account-name "${{ steps.backend.outputs.name }}" \
              --container-name tfplans \
              --name "${blob_prefix}/cloudflare-plan-output.txt" \
              --file cloudflare-plan-output.txt --auth-mode login --overwrite false --output none \
              || stored=false
            if [[ "$stored" == "true" ]]; then
              echo "::error::terraform plan exited ${plan_exit}. The complete output is private at tfplans/${blob_prefix}/cloudflare-plan-output.txt (az storage blob download — see the runbook); it is not printed here because plan output on a public repository discloses state-derived values."
            else
              echo "::error::terraform plan exited ${plan_exit} AND its output could not be stored privately — nothing was written to tfplans/${blob_prefix}/, so no diagnostics survive this run. Reproduce locally with the same variables. The output is withheld from this log because it discloses state-derived values."
            fi
            exit "$plan_exit"
          fi

          plan_sha256="$(sha256sum cloudflare.tfplan | awk '{print $1}')"
          echo "sha256=$plan_sha256" >> "$GITHUB_OUTPUT"

          jq -n \
            --arg kind "apply-cloudflare" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit_sha "$GITHUB_SHA" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --arg plan_sha256 "$plan_sha256" \
            --arg plan_blob "${blob_prefix}/cloudflare.tfplan" \
            '{kind: $kind, repository: $repository, commit_sha: $commit_sha, workflow_run_id: $workflow_run_id, plan_sha256: $plan_sha256, plan_blob: $plan_blob}' \
            > cloudflare-plan-manifest.json

          terraform show -json cloudflare.tfplan \
            | jq -r '.resource_changes[] | select(.change.actions != ["no-op"]) | "\(.change.actions | join(",")) \(.address)"' \
            > changed-resources.txt

          {
            echo "Commit: $GITHUB_SHA"
            echo "SHA-256: $plan_sha256"
            echo "Changed resources:"
            if [[ -s changed-resources.txt ]]; then
              sed 's/^/- /' changed-resources.txt
            else
              echo "- none"
            fi
          } > cloudflare-plan-summary.txt
          cat cloudflare-plan-summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Store saved plan and its review output in the private state account
        run: |
          set -euo pipefail
          az storage container create \
            --name tfplans \
            --account-name "${{ steps.backend.outputs.name }}" \
            --auth-mode login \
            --output none
          for file in cloudflare.tfplan cloudflare-plan-output.txt; do
            az storage blob upload \
              --account-name "${{ steps.backend.outputs.name }}" \
              --container-name tfplans \
              --name "${{ steps.plan.outputs.blob_prefix }}/${file}" \
              --file "$file" \
              --auth-mode login \
              --overwrite false \
              --output none
          done
          rm -f cloudflare.tfplan cloudflare-plan-output.txt

      - name: Upload sanitized Cloudflare plan-manifest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloudflare-plan-${{ github.sha }}
          path: |
            terraform/cloudflare/cloudflare-plan-manifest.json
            terraform/cloudflare/cloudflare-plan-summary.txt
          if-no-files-found: error
          # Matches the tfplans lifecycle policy. The runbook tells the
          # operator the review window is a week; an artifact expiring first
          # would spend a human approval and only then fail the download.
          retention-days: 7
          # A re-run writes a new attempt-scoped blob, but the artifact name is
          # keyed on the commit alone. Without this the manifest upload 409s on
          # the existing name and flips the run conclusion to failure,
          # permanently disqualifying an otherwise good plan from apply.
          # Overwriting is safe because the manifest is bound by hash: an
          # operator holding the earlier attempt's approved SHA-256 gets a
          # mismatch and is refused.
          overwrite: true
