name: nightly-drift
on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC nightly
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Run reconciler dry-run
        id: reconcile
        working-directory: ddi-reconciler
        env:
          # azure/login authenticates the az CLI (which DefaultAzureCredential
          # then picks up) but does not export this, and the CLI requires it
          # explicitly. It is an identifier, not a credential — the federated
          # trust in Entra is what actually grants access.
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          # --dry-run only ever issues GETs (GET /zones, GET /dns_records), so
          # a Zone:Read + DNS:Read token is sufficient here. Scoping this
          # unattended job to a read-only token means it cannot mutate DNS even
          # if something goes wrong in it; keep DNS:Edit for the lab environment.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pip install -q uv

          # cham-reconcile's exit-code contract (see ddi_reconciler/cli.py):
          #   0 converged, 1 operational error, 2 drift found (dry-run only).
          # Actions' default bash runs with -e/-o pipefail, so a nonzero exit
          # from this pipeline would otherwise abort the step before the
          # branch below can read it. Disable errexit around just this
          # command, and read PIPESTATUS[0] rather than $? so tee's own
          # always-zero exit can never mask cham-reconcile's real one.
          set +e
          uv run cham-reconcile --dry-run --desired-from-file desired-records.json \
            | tee "$GITHUB_WORKSPACE/drift.txt"
          exit_code="${PIPESTATUS[0]}"
          set -e

          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

          if [ "$exit_code" -eq 1 ]; then
            echo "::error::cham-reconcile exited 1 (operational error: config/auth/network/convergence — not drift). See the log above."
            exit 1
          fi
          # exit_code is 0 (converged) or 2 (drift found) here — both mean
          # the tool ran to completion, so let the job continue to the
          # drift-issue step, which branches on the captured code.
      - name: Open issue on drift
        if: steps.reconcile.outputs.exit_code == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const drift = fs.readFileSync('drift.txt', 'utf8');
            github.rest.issues.create({
              ...context.repo,
              title: `DNS drift detected — ${new Date().toISOString().slice(0,10)}`,
              body: `Nightly reconciler dry-run found drift:\n\`\`\`\n${drift}\n\`\`\``,
              labels: ['drift']
            });
