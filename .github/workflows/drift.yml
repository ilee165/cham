name: nightly-drift
on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC nightly
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Run reconciler dry-run
        id: reconcile
        continue-on-error: true
        run: |
          pip install -q azure-identity azure-mgmt-privatedns requests
          python ddi-reconciler/cli.py --dry-run | tee drift.txt
      - name: Open issue on drift
        if: steps.reconcile.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const drift = fs.readFileSync('drift.txt', 'utf8');
            github.rest.issues.create({
              ...context.repo,
              title: `DNS drift detected — ${new Date().toISOString().slice(0,10)}`,
              body: `Nightly reconciler dry-run found drift:\n\`\`\`\n${drift}\n\`\`\``,
              labels: ['drift']
            });
