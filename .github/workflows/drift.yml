name: nightly-drift
on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC nightly
  workflow_dispatch:

# The public edge is checked on every run; the azure-private edge is checked
# only when it exists. rg-cham-lab is destroyed between sessions for cost
# control, so an unconditional two-edge run would fail every night against a
# resource group that is absent by design — and a nightly job that is always
# red detects nothing. The gate below asks Azure whether the lab is up and
# builds the --edge list from the answer, so the same workflow is correct in
# both states and needs no edit when the lab comes and goes.
permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Read-only for this job's purposes: the reconciler runs --dry-run, and
      # the only az call is the existence check below. The OIDC subject for a
      # scheduled or dispatched run on the default branch is
      # repo:<owner>/<repo>:ref:refs/heads/main.
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Is the lab up?
        id: lab
        run: |
          set -euo pipefail
          lab_up="$(az group exists --name rg-cham-lab --output tsv)"
          # Anything other than a clean true/false means the question was not
          # actually answered (auth failure, throttling, a changed output
          # shape). Guessing "false" there would silently downgrade the run to
          # public-only and report a converged night that was never checked.
          case "$lab_up" in
            true|false) ;;
            *) echo "::error::az group exists returned '${lab_up}' — cannot determine whether the lab is up."; exit 1 ;;
          esac
          echo "lab_up=$lab_up" >> "$GITHUB_OUTPUT"

      - name: Run reconciler dry-run
        id: reconcile
        working-directory: ddi-reconciler
        env:
          # --dry-run only ever issues GETs (GET /zones, GET /dns_records), so
          # the read-only token is sufficient. This job runs unattended on a
          # schedule: giving it a token that physically cannot mutate DNS means
          # a bug here can misreport, but never destroy. DNS:Edit stays in the
          # lab environment, behind that gate, for jobs a human triggered.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_RO }}
          # The Azure provider reads this explicitly; azure/login does not set
          # it. Credentials themselves come from the login session that
          # DefaultAzureCredential picks up.
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          LAB_UP: ${{ steps.lab.outputs.lab_up }}
        run: |
          pip install -q uv

          edges=(--edge cloudflare-public)
          if [[ "$LAB_UP" == "true" ]]; then
            edges+=(--edge azure-private)
          else
            echo "rg-cham-lab is absent — checked the public edge only." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          # cham-reconcile's exit-code contract (see ddi_reconciler/cli.py):
          #   0 converged, 1 operational error, 2 drift found (dry-run only).
          # Actions' default bash runs with -e/-o pipefail, so a nonzero exit
          # from this pipeline would otherwise abort the step before the
          # branch below can read it. Disable errexit around just this
          # command, and read PIPESTATUS[0] rather than $? so tee's own
          # always-zero exit can never mask cham-reconcile's real one.
          set +e
          uv run cham-reconcile --dry-run "${edges[@]}" \
            --desired-from-file desired-records.json \
            | tee "$GITHUB_WORKSPACE/drift.txt"
          exit_code="${PIPESTATUS[0]}"
          set -e

          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

          # WR-01: only 0 (converged) and 2 (drift found) mean the tool ran to
          # completion; the gate script fails closed on 1 AND on every
          # unexpected status (126/127/137/...), which the old inline check
          # silently accepted. On 2 the job continues to the drift-issue step,
          # which branches on the captured code.
          bash "$GITHUB_WORKSPACE/scripts/check-drift-exit.sh" "$exit_code"
      - name: Open issue on drift
        if: steps.reconcile.outputs.exit_code == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const drift = fs.readFileSync('drift.txt', 'utf8');
            github.rest.issues.create({
              ...context.repo,
              title: `DNS drift detected — ${new Date().toISOString().slice(0,10)}`,
              body: `Nightly reconciler dry-run found drift:\n\`\`\`\n${drift}\n\`\`\``,
              labels: ['drift']
            });
