name: terraform-destroy
# THE KILL SWITCH. Azure has no spend cap — this is the real one.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DESTROY to confirm'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    if: inputs.confirm == 'DESTROY'
    defaults:
      run:
        working-directory: terraform/envs/lab
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Destroy
        env:
          ARM_USE_OIDC: "true"
          TF_VAR_home_ip: ${{ secrets.HOME_IP }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_wg_peer_public_key: ${{ secrets.WG_PEER_PUBLIC_KEY }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_budget_start_date: ${{ vars.BUDGET_START_DATE }}
        run: |
          terraform init
          terraform destroy -auto-approve
      - name: Leftover check
        run: |
          echo "Manually verify rg-cham-lab is empty — PIPs and disks can outlive VMs:"
          az resource list --resource-group rg-cham-lab -o table || true
