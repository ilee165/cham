name: terraform-destroy-reviewed-plan

#checkov:skip=CKV_GHA_7:owner=repository-maintainer; exact=workflow_dispatch inputs; rationale=two-stage destroy requires the operator to carry the reviewed run ID, commit, hash, operation, and confirmation into the apply dispatch; control=current main, source workflow, immutable artifact manifest/hash, main-only environment, and required reviewer are verified before exact saved-plan apply.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: First create a destroy plan; later apply that exact artifact
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan
      source_commit:
        description: Full 40-character current main commit SHA
        required: true
        type: string
      plan_run_id:
        description: For apply only, successful destroy-plan workflow run ID
        required: false
        type: string
      plan_sha256:
        description: For apply only, approved lowercase destroy-plan SHA-256
        required: false
        type: string
      confirm:
        description: Type PLAN_DESTROY for plan or DESTROY for exact-plan apply
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  actions: read

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_IN_AUTOMATION: "true"

jobs:
  plan-destroy:
    if: inputs.operation == 'plan' && inputs.confirm == 'PLAN_DESTROY'
    runs-on: ubuntu-latest
    # CR-08 (2026-08-13 review): saved-plan jobs join the shared mutation
    # group too — a destroy plan created while an apply is in flight passes
    # its freshness check against a main the apply has not yet reconciled
    # with reality. cancel-in-progress stays false so a queued run can never
    # kill a half-finished apply.
    concurrency:
      group: terraform-mutations
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
        working-directory: terraform/envs/lab

    steps:
      - name: Validate source commit
        working-directory: .
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source_commit must be a full lowercase commit SHA."; exit 1; }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0

      - name: Require current main commit
        working-directory: .
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$SOURCE_COMMIT" ]] || {
            echo "::error::source_commit is not the current main commit."
            exit 1
          }

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "~1.9.0"

      - name: Azure login (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve remote-state account
        id: backend
        run: |
          set -euo pipefail
          storage_account_name="$(az storage account list \
            --resource-group rg-cham-tfstate \
            --query '[0].name' \
            --output tsv)"
          if [[ -z "$storage_account_name" || "$storage_account_name" == "None" ]]; then
            echo "::error::No Terraform state storage account was found in rg-cham-tfstate."
            exit 1
          fi
          echo "::add-mask::$storage_account_name"
          echo "name=$storage_account_name" >> "$GITHUB_OUTPUT"

      - name: Create saved destroy plan and sanitized manifest
        id: plan
        env:
          TF_VAR_home_ip: ${{ secrets.HOME_IP }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_wg_peer_public_key: ${{ secrets.WG_PEER_PUBLIC_KEY }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_budget_start_date: ${{ vars.BUDGET_START_DATE }}
          TF_VAR_enable_test_vm_app: "false"
          TF_VAR_enable_test_vm_mgmt: "false"
          TF_VAR_enable_test_nic_app: "false"
          TF_VAR_enable_test_nic_mgmt: "false"
          TF_VAR_enable_private_resolver: "false"
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure \
            -backend-config="storage_account_name=${{ steps.backend.outputs.name }}" \
            -backend-config="subscription_id=${ARM_SUBSCRIPTION_ID}" \
            -backend-config="tenant_id=${ARM_TENANT_ID}"

          # PR #11 review (P1): the complete destroy delta names state-derived
          # values, and public workflow logs are downloadable — capture it to
          # a private review file, never stdout. The run attempt in the prefix
          # makes every reviewed plan attempt immutable.
          blob_prefix="lab/destroy/${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "blob_prefix=$blob_prefix" >> "$GITHUB_OUTPUT"
          plan_exit=0
          terraform plan -destroy -input=false -no-color -out=destroy.tfplan > destroy-output.txt 2>&1 || plan_exit=$?
          if [[ "$plan_exit" -ne 0 ]]; then
            stored=true
            # Only the upload decides whether the output survived; a failed
            # container create (it usually already exists) does not.
            az storage container create --name tfplans \
              --account-name "${{ steps.backend.outputs.name }}" \
              --auth-mode login --output none || true
            az storage blob upload \
              --account-name "${{ steps.backend.outputs.name }}" \
              --container-name tfplans \
              --name "${blob_prefix}/destroy-output.txt" \
              --file destroy-output.txt --auth-mode login --overwrite false --output none \
              || stored=false
            # The storage calls may fail, so do not promise a blob that might
            # not exist — the redirected output is the only copy there is.
            if [[ "$stored" == "true" ]]; then
              echo "::error::terraform plan -destroy exited ${plan_exit}. The complete output is private at tfplans/${blob_prefix}/destroy-output.txt (az storage blob download — see the runbook); it is not printed here because plan output on a public repository discloses state-derived values."
            else
              echo "::error::terraform plan -destroy exited ${plan_exit} AND its output could not be stored privately — nothing was written to tfplans/${blob_prefix}/, so no diagnostics survive this run. Reproduce locally with the same variables. The output is withheld from this log because it discloses state-derived values."
            fi
            exit "$plan_exit"
          fi

          plan_sha256="$(sha256sum destroy.tfplan | awk '{print $1}')"
          echo "sha256=$plan_sha256" >> "$GITHUB_OUTPUT"

          jq -n \
            --arg kind "destroy" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit_sha "$GITHUB_SHA" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --arg plan_sha256 "$plan_sha256" \
            --arg plan_blob "${blob_prefix}/destroy.tfplan" \
            '{kind: $kind, repository: $repository, commit_sha: $commit_sha, workflow_run_id: $workflow_run_id, plan_sha256: $plan_sha256, plan_blob: $plan_blob}' \
            > destroy-manifest.json

          terraform show -json destroy.tfplan \
            | jq -r '.resource_changes[] | select(.change.actions != ["no-op"]) | "\(.change.actions | join(",")) \(.address)"' \
            > destroy-summary.txt

          {
            echo "Destroy-plan commit: $GITHUB_SHA"
            echo "Destroy-plan SHA-256: $plan_sha256"
            echo "Resources selected by the saved destroy plan:"
            sed 's/^/- /' destroy-summary.txt
            echo
            echo "Nothing was destroyed. Start a second run with operation=apply, this run ID, and this exact hash."
          } >> "$GITHUB_STEP_SUMMARY"

      # NEW-CR-01 (2026-08-10 review): the raw destroy plan embeds secret
      # variable values, the full state snapshot, and the backend configuration,
      # so it and its complete review output go to the private tfplans container
      # instead of a public-repo workflow artifact. The artifact keeps only the
      # sanitized manifest and summary; the manifest binds the blob path, and
      # --overwrite false makes every reviewed plan attempt immutable.
      - name: Store saved destroy plan and its review output in the private state account
        run: |
          set -euo pipefail
          az storage container create \
            --name tfplans \
            --account-name "${{ steps.backend.outputs.name }}" \
            --auth-mode login \
            --output none
          for file in destroy.tfplan destroy-output.txt; do
            az storage blob upload \
              --account-name "${{ steps.backend.outputs.name }}" \
              --container-name tfplans \
              --name "${{ steps.plan.outputs.blob_prefix }}/${file}" \
              --file "$file" \
              --auth-mode login \
              --overwrite false \
              --output none
          done
          rm -f destroy.tfplan destroy-output.txt

      - name: Upload sanitized destroy-manifest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-destroy-${{ inputs.source_commit }}-${{ github.run_id }}
          path: |
            terraform/envs/lab/destroy-manifest.json
            terraform/envs/lab/destroy-summary.txt
          if-no-files-found: error
          # Same reasoning as plan.yml: match the 7-day tfplans lifecycle so
          # the artifact never expires before the review window it documents,
          # and allow a re-run to replace its own manifest rather than 409 and
          # disqualify the run. Hash binding still refuses a stale approval.
          retention-days: 7
          overwrite: true

  apply-destroy:
    # Pinned to main for the same reason apply.yml's jobs are: dispatch runs
    # the workflow file from the dispatched ref, and every verification step in
    # this job lives inside that file.
    if: >-
      inputs.operation == 'apply'
      && inputs.confirm == 'DESTROY'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # CR-08: same shared mutation group as every other state-touching job.
    concurrency:
      group: terraform-mutations
      cancel-in-progress: false
    environment: lab
    env:
      ENVIRONMENT_NAME: lab
    defaults:
      run:
        shell: bash
        working-directory: terraform/envs/lab

    steps:
      - name: Require configured environment protections
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          set -euo pipefail
          environment_json="$(gh api "repos/$GITHUB_REPOSITORY/environments/$ENVIRONMENT_NAME")"

          reviewer_rules="$(jq '[.protection_rules[] | select(.type == "required_reviewers")] | length' <<< "$environment_json")"
          if [[ "$reviewer_rules" -lt 1 ]]; then
            echo "::error::The $ENVIRONMENT_NAME environment has no required-reviewer protection rule. Nothing was destroyed."
            exit 1
          fi

          # `protected_branches` is not accepted as proof: it means "any branch
          # a protection rule or ruleset covers", not "main". Only an explicit
          # custom policy naming main and nothing else counts; an environment
          # using protected_branches 404s here and fails closed.
          custom_branches="$(gh api \
            "repos/$GITHUB_REPOSITORY/environments/$ENVIRONMENT_NAME/deployment-branch-policies" \
            --jq '[.branch_policies[].name] | sort | join(",")' 2>/dev/null || echo "")"
          if [[ "$custom_branches" != "main" ]]; then
            echo "::error::The $ENVIRONMENT_NAME environment does not restrict deployments to main alone (custom branch policy: [$custom_branches]). Nothing was destroyed."
            exit 1
          fi

      - name: Validate approval inputs
        working-directory: .
        env:
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          APPROVED_SHA256: ${{ inputs.plan_sha256 }}
        run: |
          set -euo pipefail
          [[ "$PLAN_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::plan_run_id must be numeric."; exit 1; }
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source_commit must be a full lowercase commit SHA."; exit 1; }
          [[ "$APPROVED_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::plan_sha256 must be a lowercase SHA-256."; exit 1; }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0

      - name: Verify current main and destroy-plan workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        working-directory: .
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$SOURCE_COMMIT" ]] || {
            echo "::error::main moved after destroy planning. Generate and approve a new destroy plan."
            exit 1
          }

          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PLAN_RUN_ID")"
          [[ "$(jq -r '.event' <<< "$run_json")" == "workflow_dispatch" ]] || { echo "::error::Destroy plan must come from workflow_dispatch."; exit 1; }
          [[ "$(jq -r '.head_branch' <<< "$run_json")" == "main" ]] || { echo "::error::Destroy plan did not run on main."; exit 1; }
          [[ "$(jq -r '.head_sha' <<< "$run_json")" == "$SOURCE_COMMIT" ]] || { echo "::error::Destroy-plan commit mismatch."; exit 1; }
          [[ "$(jq -r '.conclusion' <<< "$run_json")" == "success" ]] || { echo "::error::Destroy-plan run did not complete successfully."; exit 1; }
          [[ "$(jq -r '.path' <<< "$run_json")" == ".github/workflows/destroy.yml" ]] || { echo "::error::Run ID is not from the destroy workflow."; exit 1; }

      - name: Download sanitized destroy manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: terraform-destroy-${{ inputs.source_commit }}-${{ inputs.plan_run_id }}
          path: terraform/envs/lab
          github-token: ${{ github.token }}
          run-id: ${{ inputs.plan_run_id }}

      # The destroy-plan binary is NOT in the artifact (NEW-CR-01): it lives in
      # the private tfplans container and is fetched after Azure login below,
      # where its hash is checked against the same approved value. The blob
      # path the manifest names must belong to this exact verified run.
      - name: Verify destroy artifact manifest and approved hash
        id: manifest
        env:
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          APPROVED_SHA256: ${{ inputs.plan_sha256 }}
        run: |
          set -euo pipefail
          manifest_sha256="$(jq -r '.plan_sha256' destroy-manifest.json)"
          manifest_commit="$(jq -r '.commit_sha' destroy-manifest.json)"
          manifest_run_id="$(jq -r '.workflow_run_id' destroy-manifest.json)"
          manifest_repository="$(jq -r '.repository' destroy-manifest.json)"
          manifest_kind="$(jq -r '.kind' destroy-manifest.json)"
          manifest_blob="$(jq -r '.plan_blob' destroy-manifest.json)"

          [[ "$manifest_kind" == "destroy" ]] || { echo "::error::Artifact is not a destroy plan."; exit 1; }
          [[ "$manifest_repository" == "$GITHUB_REPOSITORY" ]] || { echo "::error::Artifact repository mismatch."; exit 1; }
          [[ "$manifest_commit" == "$SOURCE_COMMIT" ]] || { echo "::error::Artifact commit mismatch."; exit 1; }
          [[ "$manifest_run_id" == "$PLAN_RUN_ID" ]] || { echo "::error::Artifact run ID mismatch."; exit 1; }
          [[ "$manifest_sha256" == "$APPROVED_SHA256" ]] || { echo "::error::Manifest hash differs from approved hash."; exit 1; }
          [[ "$manifest_blob" =~ ^lab/destroy/${SOURCE_COMMIT}-${PLAN_RUN_ID}-[0-9]+/destroy\.tfplan$ ]] || { echo "::error::Manifest plan_blob does not match the verified destroy-plan run identity."; exit 1; }
          echo "blob=$manifest_blob" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "~1.9.0"

      - name: Azure login (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve remote-state account
        id: backend
        run: |
          set -euo pipefail
          storage_account_name="$(az storage account list \
            --resource-group rg-cham-tfstate \
            --query '[0].name' \
            --output tsv)"
          if [[ -z "$storage_account_name" || "$storage_account_name" == "None" ]]; then
            echo "::error::No Terraform state storage account was found in rg-cham-tfstate."
            exit 1
          fi
          echo "::add-mask::$storage_account_name"
          echo "name=$storage_account_name" >> "$GITHUB_OUTPUT"

      # The blob path comes from the manifest, whose binding to this exact
      # verified run was checked above, so it can only name the blob that
      # destroy-plan run wrote; the hash check pins the content.
      - name: Download exact reviewed destroy plan from private storage
        env:
          APPROVED_SHA256: ${{ inputs.plan_sha256 }}
        run: |
          set -euo pipefail
          az storage blob download \
            --account-name "${{ steps.backend.outputs.name }}" \
            --container-name tfplans \
            --name "${{ steps.manifest.outputs.blob }}" \
            --file destroy.tfplan \
            --auth-mode login \
            --output none
          computed_sha256="$(sha256sum destroy.tfplan | awk '{print $1}')"
          [[ "$computed_sha256" == "$APPROVED_SHA256" ]] || { echo "::error::Saved destroy-plan hash verification failed."; exit 1; }

      - name: Terraform init
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure \
            -backend-config="storage_account_name=${{ steps.backend.outputs.name }}" \
            -backend-config="subscription_id=${ARM_SUBSCRIPTION_ID}" \
            -backend-config="tenant_id=${ARM_TENANT_ID}"

      # CR-08 (2026-08-13 review): the early freshness check runs before the
      # environment approval wait and the plan download, so main can move
      # between it and the destroy. Re-checking immediately before the
      # apply-only step shrinks that window to the gap between two adjacent
      # steps.
      - name: Re-verify main has not moved
        uses: ./.github/actions/verify-main-unmoved
        with:
          source_commit: ${{ inputs.source_commit }}
          failure_message: main moved after destroy planning. Generate and approve a new destroy plan.

      - name: Apply exact reviewed destroy plan
        run: |
          set -euo pipefail
          terraform apply -input=false destroy.tfplan

      - name: Verify lab resource group is empty
        run: |
          set -euo pipefail
          group_exists="$(az group exists --name rg-cham-lab --output tsv)"
          [[ "$group_exists" == "false" ]] || {
            echo "::error::rg-cham-lab still exists after the reviewed destroy plan."
            az resource list --resource-group rg-cham-lab --query '[].{type:type,name:name}' --output table
            exit 1
          }
