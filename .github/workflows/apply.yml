name: terraform-apply-reviewed-plan

#checkov:skip=CKV_GHA_7:owner=repository-maintainer; exact=workflow_dispatch inputs; rationale=run ID, commit, SHA-256, and confirmation are the operator's reviewed-plan approval binding; control=all formats, the successful source workflow, current main, immutable artifact manifest/hash, main-only environment, and required reviewer are verified before Azure login or Terraform apply.
on:
  workflow_dispatch:
    inputs:
      stack:
        description: Which stack this reviewed plan belongs to
        required: true
        type: choice
        default: lab
        options: [lab, cloudflare]
      plan_run_id:
        description: Successful terraform-plan workflow run ID from main
        required: true
        type: string
      source_commit:
        description: Full 40-character main commit SHA used to create the plan
        required: true
        type: string
      plan_sha256:
        description: Approved lowercase SHA-256 from the saved-plan summary
        required: true
        type: string
      confirm:
        description: Type APPLY to apply this exact reviewed plan
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  actions: read

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_IN_AUTOMATION: "true"

jobs:
  apply:
    # github.ref is constrained here as well as by the environment's
    # deployment-branch policy. workflow_dispatch runs the workflow file from
    # whatever ref was dispatched, and every verification step below lives
    # inside that same file — so without this condition the branch policy is
    # the only thing standing between a pushed branch and an apply job whose
    # checks have been edited out.
    if: >-
      inputs.confirm == 'APPLY'
      && inputs.stack == 'lab'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # CR-08 (2026-08-13 review): one group shared by every job that touches
    # the state backend, across plan/apply/destroy — a plan created mid-apply
    # is the TOCTOU seam its freshness check cannot see. cancel-in-progress
    # stays false so a queued run can never kill a half-finished apply.
    concurrency:
      group: terraform-mutations
      cancel-in-progress: false
    environment: lab
    env:
      ENVIRONMENT_NAME: lab
    defaults:
      run:
        shell: bash
        working-directory: terraform/envs/lab

    steps:
      - name: Require configured environment protections
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          set -euo pipefail
          environment_json="$(gh api "repos/$GITHUB_REPOSITORY/environments/$ENVIRONMENT_NAME")"

          reviewer_rules="$(jq '[.protection_rules[] | select(.type == "required_reviewers")] | length' <<< "$environment_json")"
          if [[ "$reviewer_rules" -lt 1 ]]; then
            echo "::error::The $ENVIRONMENT_NAME environment has no required-reviewer protection rule. Nothing was applied."
            exit 1
          fi

          # The reviewer rule was already asserted; the branch policy was not,
          # and it is the control that pins the executed workflow file — and
          # therefore every check in this job — to main. An unasserted control
          # is one nobody notices the loss of, so assert it here too.
          #
          # Deliberately NOT accepting GitHub's `protected_branches` setting as
          # proof: it means "any branch covered by a branch protection rule or
          # ruleset", not "main". A ruleset later targeting release/* or every
          # branch would widen who may deploy while this check kept passing.
          # Only an explicit custom policy naming main and nothing else counts;
          # an environment using protected_branches returns 404 here and fails
          # closed.
          custom_branches="$(gh api \
            "repos/$GITHUB_REPOSITORY/environments/$ENVIRONMENT_NAME/deployment-branch-policies" \
            --jq '[.branch_policies[].name] | sort | join(",")' 2>/dev/null || echo "")"
          if [[ "$custom_branches" != "main" ]]; then
            echo "::error::The $ENVIRONMENT_NAME environment does not restrict deployments to main alone (custom branch policy: [$custom_branches]). Nothing was applied."
            exit 1
          fi

      - name: Validate approval inputs
        working-directory: .
        env:
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          APPROVED_SHA256: ${{ inputs.plan_sha256 }}
        run: |
          set -euo pipefail
          [[ "$PLAN_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::plan_run_id must be numeric."; exit 1; }
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source_commit must be a full lowercase commit SHA."; exit 1; }
          [[ "$APPROVED_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::plan_sha256 must be a lowercase SHA-256."; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0

      - name: Verify current main and source workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        working-directory: .
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          current_main="$(git rev-parse origin/main)"
          [[ "$current_main" == "$SOURCE_COMMIT" ]] || {
            echo "::error::main moved after planning. Generate and approve a new saved plan."
            exit 1
          }

          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PLAN_RUN_ID")"
          [[ "$(jq -r '.event' <<< "$run_json")" == "workflow_dispatch" ]] || { echo "::error::Plan must come from a manual workflow dispatch."; exit 1; }
          [[ "$(jq -r '.head_branch' <<< "$run_json")" == "main" ]] || { echo "::error::Plan workflow did not run on main."; exit 1; }
          [[ "$(jq -r '.head_sha' <<< "$run_json")" == "$SOURCE_COMMIT" ]] || { echo "::error::Plan workflow commit does not match source_commit."; exit 1; }
          [[ "$(jq -r '.conclusion' <<< "$run_json")" == "success" ]] || { echo "::error::Plan workflow did not complete successfully."; exit 1; }
          [[ "$(jq -r '.path' <<< "$run_json")" == ".github/workflows/plan.yml" ]] || { echo "::error::Run ID is not from terraform-plan."; exit 1; }

      - name: Download sanitized plan manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terraform-plan-${{ inputs.source_commit }}
          path: terraform/envs/lab
          github-token: ${{ github.token }}
          run-id: ${{ inputs.plan_run_id }}

      # The plan binary itself is NOT in the artifact (NEW-CR-01): it lives in
      # the private tfplans container and is fetched after Azure login below.
      # This step verifies everything the manifest binds — including that the
      # blob path the manifest names belongs to this exact verified run (the
      # attempt segment makes each reviewed plan immutable); the binary's hash
      # is verified against the same approved value the moment it downloads.
      - name: Verify artifact manifest and approved hash
        id: manifest
        env:
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          APPROVED_SHA256: ${{ inputs.plan_sha256 }}
        run: |
          set -euo pipefail
          manifest_sha256="$(jq -r '.plan_sha256' plan-manifest.json)"
          manifest_commit="$(jq -r '.commit_sha' plan-manifest.json)"
          manifest_run_id="$(jq -r '.workflow_run_id' plan-manifest.json)"
          manifest_repository="$(jq -r '.repository' plan-manifest.json)"
          manifest_kind="$(jq -r '.kind' plan-manifest.json)"
          manifest_blob="$(jq -r '.plan_blob' plan-manifest.json)"

          [[ "$manifest_kind" == "apply" ]] || { echo "::error::Artifact is not an apply plan."; exit 1; }
          [[ "$manifest_repository" == "$GITHUB_REPOSITORY" ]] || { echo "::error::Artifact repository mismatch."; exit 1; }
          [[ "$manifest_commit" == "$SOURCE_COMMIT" ]] || { echo "::error::Artifact commit mismatch."; exit 1; }
          [[ "$manifest_run_id" == "$PLAN_RUN_ID" ]] || { echo "::error::Artifact run ID mismatch."; exit 1; }
          [[ "$manifest_sha256" == "$APPROVED_SHA256" ]] || { echo "::error::Manifest hash differs from approved hash."; exit 1; }
          [[ "$manifest_blob" =~ ^lab/apply/${SOURCE_COMMIT}-${PLAN_RUN_ID}-[0-9]+/tfplan$ ]] || { echo "::error::Manifest plan_blob does not match the verified plan run identity."; exit 1; }
          echo "blob=$manifest_blob" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "~1.9.0"

      - name: Azure login (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve remote-state account
        id: backend
        run: |
          set -euo pipefail
          storage_account_name="$(az storage account list \
            --resource-group rg-cham-tfstate \
            --query '[0].name' \
            --output tsv)"
          if [[ -z "$storage_account_name" || "$storage_account_name" == "None" ]]; then
            echo "::error::No Terraform state storage account was found in rg-cham-tfstate."
            exit 1
          fi
          echo "::add-mask::$storage_account_name"
          echo "name=$storage_account_name" >> "$GITHUB_OUTPUT"

      # The blob path comes from the manifest, whose binding to this exact
      # verified run (repository/commit/run/attempt) was checked above, so it
      # can only name the blob that run wrote. Hash verification then pins the
      # content byte-for-byte to what the operator approved.
      - name: Download exact reviewed plan from private storage
        env:
          APPROVED_SHA256: ${{ inputs.plan_sha256 }}
        run: |
          set -euo pipefail
          az storage blob download \
            --account-name "${{ steps.backend.outputs.name }}" \
            --container-name tfplans \
            --name "${{ steps.manifest.outputs.blob }}" \
            --file tfplan \
            --auth-mode login \
            --output none
          computed_sha256="$(sha256sum tfplan | awk '{print $1}')"
          [[ "$computed_sha256" == "$APPROVED_SHA256" ]] || { echo "::error::Saved-plan hash verification failed."; exit 1; }

      - name: Terraform init
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure \
            -backend-config="storage_account_name=${{ steps.backend.outputs.name }}" \
            -backend-config="subscription_id=${ARM_SUBSCRIPTION_ID}" \
            -backend-config="tenant_id=${ARM_TENANT_ID}"

      # CR-08 (2026-08-13 review): the early freshness check above runs before
      # the environment approval wait and the plan download, so main can move
      # between it and the apply. Re-checking here, with nothing but the apply
      # left in the job, shrinks that window to the gap between two adjacent
      # steps. The early check stays for fast feedback; this one is the
      # enforcement.
      - name: Re-verify main has not moved
        uses: ./.github/actions/verify-main-unmoved
        with:
          source_commit: ${{ inputs.source_commit }}
          failure_message: main moved after planning. Generate and approve a new saved plan.

      - name: Apply exact reviewed plan
        run: |
          set -euo pipefail
          terraform apply -input=false tfplan

  # Identical trust chain for the public-DNS stack. It writes into a zone that
  # carries live Microsoft 365 mail records, so it earns the same treatment the
  # lab stack gets — never a fresh plan, never -auto-approve, never a bare
  # init, and the edit-capable Cloudflare token only ever inside the
  # environment gate a human has just approved.
  apply-cloudflare:
    if: >-
      inputs.confirm == 'APPLY'
      && inputs.stack == 'cloudflare'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # CR-08: same shared mutation group as the lab apply.
    concurrency:
      group: terraform-mutations
      cancel-in-progress: false
    # A separate environment, not `lab`. Environment secrets are scoped to the
    # environment and never to a job, so parking the DNS:Edit token on `lab`
    # would put it inside the secret scope of the lab apply AND of destroy.yml
    # — meaning an operator approving a routine teardown from their phone would
    # mechanically be approving a job that can read the token for the zone
    # carrying dwsolution.co's Microsoft 365 mail records. Its own environment
    # makes the approval prompt mean what the approval actually grants.
    environment: cloudflare-prod
    env:
      ENVIRONMENT_NAME: cloudflare-prod
    defaults:
      run:
        shell: bash
        working-directory: terraform/cloudflare

    steps:
      - name: Require configured environment protections
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          set -euo pipefail
          environment_json="$(gh api "repos/$GITHUB_REPOSITORY/environments/$ENVIRONMENT_NAME")"

          reviewer_rules="$(jq '[.protection_rules[] | select(.type == "required_reviewers")] | length' <<< "$environment_json")"
          if [[ "$reviewer_rules" -lt 1 ]]; then
            echo "::error::The $ENVIRONMENT_NAME environment has no required-reviewer protection rule. Nothing was applied."
            exit 1
          fi

          # The reviewer rule was already asserted; the branch policy was not,
          # and it is the control that pins the executed workflow file — and
          # therefore every check in this job — to main. An unasserted control
          # is one nobody notices the loss of, so assert it here too.
          #
          # Deliberately NOT accepting GitHub's `protected_branches` setting as
          # proof: it means "any branch covered by a branch protection rule or
          # ruleset", not "main". A ruleset later targeting release/* or every
          # branch would widen who may deploy while this check kept passing.
          # Only an explicit custom policy naming main and nothing else counts;
          # an environment using protected_branches returns 404 here and fails
          # closed.
          custom_branches="$(gh api \
            "repos/$GITHUB_REPOSITORY/environments/$ENVIRONMENT_NAME/deployment-branch-policies" \
            --jq '[.branch_policies[].name] | sort | join(",")' 2>/dev/null || echo "")"
          if [[ "$custom_branches" != "main" ]]; then
            echo "::error::The $ENVIRONMENT_NAME environment does not restrict deployments to main alone (custom branch policy: [$custom_branches]). Nothing was applied."
            exit 1
          fi

      - name: Validate approval inputs
        working-directory: .
        env:
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          APPROVED_SHA256: ${{ inputs.plan_sha256 }}
        run: |
          set -euo pipefail
          [[ "$PLAN_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::plan_run_id must be numeric."; exit 1; }
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source_commit must be a full lowercase commit SHA."; exit 1; }
          [[ "$APPROVED_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::plan_sha256 must be a lowercase SHA-256."; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0

      - name: Verify current main and source workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        working-directory: .
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          current_main="$(git rev-parse origin/main)"
          [[ "$current_main" == "$SOURCE_COMMIT" ]] || {
            echo "::error::main moved after planning. Generate and approve a new saved plan."
            exit 1
          }

          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PLAN_RUN_ID")"
          [[ "$(jq -r '.event' <<< "$run_json")" == "workflow_dispatch" ]] || { echo "::error::Plan must come from a manual workflow dispatch."; exit 1; }
          [[ "$(jq -r '.head_branch' <<< "$run_json")" == "main" ]] || { echo "::error::Plan workflow did not run on main."; exit 1; }
          [[ "$(jq -r '.head_sha' <<< "$run_json")" == "$SOURCE_COMMIT" ]] || { echo "::error::Plan workflow commit does not match source_commit."; exit 1; }
          [[ "$(jq -r '.conclusion' <<< "$run_json")" == "success" ]] || { echo "::error::Plan workflow did not complete successfully."; exit 1; }
          [[ "$(jq -r '.path' <<< "$run_json")" == ".github/workflows/plan.yml" ]] || { echo "::error::Run ID is not from terraform-plan."; exit 1; }

      - name: Download sanitized plan manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cloudflare-plan-${{ inputs.source_commit }}
          path: terraform/cloudflare
          github-token: ${{ github.token }}
          run-id: ${{ inputs.plan_run_id }}

      # `kind` is what stops a lab manifest from being replayed here (and vice
      # versa): both stacks plan from the same workflow, so run identity alone
      # would not distinguish them.
      - name: Verify artifact manifest and approved hash
        id: manifest
        env:
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          APPROVED_SHA256: ${{ inputs.plan_sha256 }}
        run: |
          set -euo pipefail
          manifest_sha256="$(jq -r '.plan_sha256' cloudflare-plan-manifest.json)"
          manifest_commit="$(jq -r '.commit_sha' cloudflare-plan-manifest.json)"
          manifest_run_id="$(jq -r '.workflow_run_id' cloudflare-plan-manifest.json)"
          manifest_repository="$(jq -r '.repository' cloudflare-plan-manifest.json)"
          manifest_kind="$(jq -r '.kind' cloudflare-plan-manifest.json)"
          manifest_blob="$(jq -r '.plan_blob' cloudflare-plan-manifest.json)"

          [[ "$manifest_kind" == "apply-cloudflare" ]] || { echo "::error::Artifact is not a Cloudflare apply plan."; exit 1; }
          [[ "$manifest_repository" == "$GITHUB_REPOSITORY" ]] || { echo "::error::Artifact repository mismatch."; exit 1; }
          [[ "$manifest_commit" == "$SOURCE_COMMIT" ]] || { echo "::error::Artifact commit mismatch."; exit 1; }
          [[ "$manifest_run_id" == "$PLAN_RUN_ID" ]] || { echo "::error::Artifact run ID mismatch."; exit 1; }
          [[ "$manifest_sha256" == "$APPROVED_SHA256" ]] || { echo "::error::Manifest hash differs from approved hash."; exit 1; }
          [[ "$manifest_blob" =~ ^cloudflare/apply/${SOURCE_COMMIT}-${PLAN_RUN_ID}-[0-9]+/cloudflare\.tfplan$ ]] || { echo "::error::Manifest plan_blob does not match the verified plan run identity."; exit 1; }
          echo "blob=$manifest_blob" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "~1.9.0"

      - name: Azure login (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve remote-state account
        id: backend
        run: |
          set -euo pipefail
          storage_account_name="$(az storage account list \
            --resource-group rg-cham-tfstate \
            --query '[0].name' \
            --output tsv)"
          if [[ -z "$storage_account_name" || "$storage_account_name" == "None" ]]; then
            echo "::error::No Terraform state storage account was found in rg-cham-tfstate."
            exit 1
          fi
          echo "::add-mask::$storage_account_name"
          echo "name=$storage_account_name" >> "$GITHUB_OUTPUT"

      - name: Download exact reviewed plan from private storage
        env:
          APPROVED_SHA256: ${{ inputs.plan_sha256 }}
        run: |
          set -euo pipefail
          az storage blob download \
            --account-name "${{ steps.backend.outputs.name }}" \
            --container-name tfplans \
            --name "${{ steps.manifest.outputs.blob }}" \
            --file cloudflare.tfplan \
            --auth-mode login \
            --output none
          computed_sha256="$(sha256sum cloudflare.tfplan | awk '{print $1}')"
          [[ "$computed_sha256" == "$APPROVED_SHA256" ]] || { echo "::error::Saved-plan hash verification failed."; exit 1; }

      - name: Terraform init
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure \
            -backend-config="storage_account_name=${{ steps.backend.outputs.name }}" \
            -backend-config="subscription_id=${ARM_SUBSCRIPTION_ID}" \
            -backend-config="tenant_id=${ARM_TENANT_ID}"

      # CR-08: same adjacency argument as the lab job — the re-check is the
      # enforcement, the early check is the fast feedback.
      - name: Re-verify main has not moved
        uses: ./.github/actions/verify-main-unmoved
        with:
          source_commit: ${{ inputs.source_commit }}
          failure_message: main moved after planning. Generate and approve a new saved plan.

      - name: Apply exact reviewed Cloudflare plan
        env:
          # Environment-scoped edit token (DOC-B06): reachable only from this
          # approved job, never from the scheduled drift run.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          terraform apply -input=false cloudflare.tfplan
